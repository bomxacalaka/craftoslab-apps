name: ci

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Lua 5.2 from source
        run: |
          curl -fsSL -o /tmp/lua.tar.gz https://www.lua.org/ftp/lua-5.2.4.tar.gz
          tar -xzf /tmp/lua.tar.gz -C /tmp
          make -C /tmp/lua-5.2.4 generic
      - name: Syntax-check every Lua file (luac -p)
        run: |
          count=0; fail=0
          while IFS= read -r -d '' file; do
            count=$((count+1))
            /tmp/lua-5.2.4/src/luac -p "$file" || fail=1
          done < <(find . -name '*.lua' -type f -print0)
          echo "Checked $count Lua file(s) with Lua 5.2"
          exit $fail
      - name: Verify model checksums
        run: |
          (cd llama.lua && sha256sum -c SHA256SUMS)
          (cd draw-ocr.lua && sha256sum -c SHA256SUMS)
